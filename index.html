<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倒數100秒－抗藥魔王大作戰｜活動已結束</title>
<style>
:root{--bg1:#bfe3f2;--bg2:#f6f1d8;--card:#fffdf4;--ink:#3b4a3f;--acc:#e8836a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg1:#1f3547;--bg2:#3a3b52;--card:#26302b;--ink:#eef0e2;--acc:#f09a7f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:var(--ink);
background:linear-gradient(var(--bg1),var(--bg2))}
.card{max-width:520px;width:100%;background:var(--card);border-radius:24px;padding:36px 28px;text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.15)}
.emoji{font-size:3rem}
h1{font-size:1.4rem;margin:12px 0 4px}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:20px;padding:4px 16px;margin:10px 0 16px;font-weight:700}
p{line-height:1.8;margin:8px 0}
.foot{opacity:.7;font-size:.9rem;margin-top:18px}
</style></head><body>
<main class="card">
<div class="emoji">🌿</div>
<h1>倒數100秒－抗藥魔王大作戰</h1>
<div class="tag">活動已結束</div>
<p>感謝您的熱情參與！</p>
<p>本活動已圓滿結束，遊戲及成績收集已關閉。<br>期待下次再與您一起守護抗生素，對抗抗藥性。</p>
<p class="foot">感染管制室 敬上</p>
</main>
</body></html>
